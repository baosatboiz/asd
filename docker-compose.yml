version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-db
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore123
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore"]
      interval: 10s
      timeout: 5s
      retries: 5

  staff:
    build: ./staff
    container_name: staff-service
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_ENGINE=postgresql
      - DB_NAME=bookstore
      - DB_USER=bookstore
      - DB_PASSWORD=bookstore123
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  manager:
    build: ./manager
    container_name: manager-service
    ports:
      - "8001:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_ENGINE=postgresql
      - DB_NAME=bookstore
      - DB_USER=bookstore
      - DB_PASSWORD=bookstore123
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  customer:
    build: ./customer
    container_name: customer-service
    ports:
      - "8002:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - CART_SERVICE_URL=http://cart:8000
      - DB_ENGINE=postgresql
      - DB_NAME=bookstore
      - DB_USER=bookstore
      - DB_PASSWORD=bookstore123
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    build: ./catalog
    container_name: catalog-service
    ports:
      - "8003:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_ENGINE=postgresql
      - DB_NAME=bookstore
      - DB_USER=bookstore
      - DB_PASSWORD=bookstore123
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  book:
    build: ./book
    container_name: book-service
    ports:
      - "8004:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_ENGINE=postgresql
      - DB_NAME=bookstore
      - DB_USER=bookstore
      - DB_PASSWORD=bookstore123
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  cart:
    build: ./cart
    container_name: cart-service
    ports:
      - "8005:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - BOOK_SERVICE_URL=http://book:8000
      - CLOTHES_SERVICE_URL=http://clothes:8000
      - DB_ENGINE=postgresql
      - DB_NAME=bookstore
      - DB_USER=bookstore
      - DB_PASSWORD=bookstore123
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  order:
    build: ./order
    container_name: order-service
    ports:
      - "8006:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - PAY_SERVICE_URL=http://pay:8000
      - SHIP_SERVICE_URL=http://ship:8000
      - AI_SERVICE_URL=http://ai-service:8000
      - DB_ENGINE=postgresql
      - DB_NAME=bookstore
      - DB_USER=bookstore
      - DB_PASSWORD=bookstore123
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  ship:
    build: ./ship
    container_name: ship-service
    ports:
      - "8007:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_ENGINE=postgresql
      - DB_NAME=bookstore
      - DB_USER=bookstore
      - DB_PASSWORD=bookstore123
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  pay:
    build: ./pay
    container_name: pay-service
    ports:
      - "8008:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_ENGINE=postgresql
      - DB_NAME=bookstore
      - DB_USER=bookstore
      - DB_PASSWORD=bookstore123
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  comment-rate:
    build: ./comment-rate
    container_name: comment-rate-service
    ports:
      - "8009:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - ORDER_SERVICE_URL=http://order:8000
      - DB_ENGINE=postgresql
      - DB_NAME=bookstore
      - DB_USER=bookstore
      - DB_PASSWORD=bookstore123
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  recommender-ai:
    build: ./recommender-ai
    container_name: recommender-ai-service
    ports:
      - "8010:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - ORDER_SERVICE_URL=http://order:8000
      - COMMENT_RATE_SERVICE_URL=http://comment-rate:8000
      - DB_ENGINE=postgresql
      - DB_NAME=bookstore
      - DB_USER=bookstore
      - DB_PASSWORD=bookstore123
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build: ./ai-service
    container_name: ai-service
    ports:
      - "8013:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}

  clothes:
    build: ./clothes
    container_name: clothes-service
    ports:
      - "8012:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DB_ENGINE=postgresql
      - DB_NAME=bookstore
      - DB_USER=bookstore
      - DB_PASSWORD=bookstore123
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway-service
    ports:
      - "8011:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - STAFF_SERVICE_URL=http://staff:8000
      - MANAGER_SERVICE_URL=http://manager:8000
      - CATALOG_SERVICE_URL=http://catalog:8000
      - BOOK_SERVICE_URL=http://book:8000
      - CLOTHES_SERVICE_URL=http://clothes:8000
      - RECOMMENDER_SERVICE_URL=http://recommender-ai:8000
      - COMMENT_RATE_SERVICE_URL=http://comment-rate:8000
      - CUSTOMER_SERVICE_URL=http://customer:8000
      - CART_SERVICE_URL=http://cart:8000
      - ORDER_SERVICE_URL=http://order:8000
      - PAY_SERVICE_URL=http://pay:8000
      - SHIP_SERVICE_URL=http://ship:8000
      - DB_ENGINE=postgresql
      - DB_NAME=bookstore
      - DB_USER=bookstore
      - DB_PASSWORD=bookstore123
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
